[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-from-scratch-cpp-python"
version = "0.1.0"
description = "Machine-learning algorithms implemented from scratch across Python and C++."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Vladyslav Deviatkov" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
numpy = ["numpy>=2.0"]
pytorch = [
  "torch>=2.3",
  "torchvision>=0.18",
]
plotting = ["matplotlib>=3.9"]

[project.scripts]
ml-perceptron-logic-gates = "ml_scratch.pure.perceptron.experiment:main"
ml-xor-mlp = "ml_scratch.pure.mlp.experiment:main"
ml-linear-regression = "ml_scratch.pure.linear_regression.experiment:main"
ml-logistic-regression = "ml_scratch.pure.logistic_regression.experiment:main"
ml-decision-tree = "ml_scratch.pure.decision_tree.experiment:main"
ml-pca-kmeans = "ml_scratch.pure.pca_kmeans.experiment:main"

ml-numpy-perceptron = "ml_scratch.numpy.perceptron.experiment:main"
ml-numpy-mlp = "ml_scratch.numpy.mlp.experiment:main"
ml-numpy-linear-regression = "ml_scratch.numpy.linear_regression.experiment:main"
ml-numpy-logistic-regression = "ml_scratch.numpy.logistic_regression.experiment:main"
ml-numpy-pca-kmeans = "ml_scratch.numpy.pca_kmeans.experiment:main"
ml-numpy-decision-tree = "ml_scratch.numpy.decision_tree.experiment:main"

ml-pytorch-perceptron = "ml_scratch.pytorch.perceptron.experiment:main"
ml-pytorch-mlp = "ml_scratch.pytorch.mlp.experiment:main"
ml-pytorch-linear-regression = "ml_scratch.pytorch.linear_regression.experiment:main"
ml-pytorch-logistic-regression = "ml_scratch.pytorch.logistic_regression.experiment:main"
ml-pytorch-pca-kmeans = "ml_scratch.pytorch.pca_kmeans.experiment:main"
ml-pytorch-decision-tree = "ml_scratch.pytorch.decision_tree.experiment:main"

[tool.setuptools]
packages = [
  "ml_scratch",
  "ml_scratch.pure",
  "ml_scratch.numpy",
  "ml_scratch.pytorch",
  "ml_scratch.pytorch.perceptron",
  "ml_scratch.pytorch.mlp",
  "ml_scratch.pytorch.linear_regression",
  "ml_scratch.pytorch.logistic_regression",
  "ml_scratch.pytorch.pca_kmeans",
  "ml_scratch.pytorch.decision_tree",
  "ml_scratch.numpy.perceptron",
  "ml_scratch.numpy.mlp",
  "ml_scratch.numpy.linear_regression",
  "ml_scratch.numpy.logistic_regression",
  "ml_scratch.numpy.pca_kmeans",
  "ml_scratch.numpy.decision_tree",
  "ml_scratch.pure.perceptron",
  "ml_scratch.pure.mlp",
  "ml_scratch.pure.linear_regression",
  "ml_scratch.pure.logistic_regression",
  "ml_scratch.pure.pca_kmeans",
  "ml_scratch.pure.decision_tree",
]

[tool.setuptools.package-dir]
"ml_scratch" = "shared/python/ml_scratch"
"ml_scratch.pure" = "shared/python/ml_scratch/pure"
"ml_scratch.numpy" = "shared/python/ml_scratch/numpy"
"ml_scratch.pytorch" = "shared/python/ml_scratch/pytorch"
"ml_scratch.pytorch.perceptron" = "topics/01_perceptron_logic_gates/pytorch"
"ml_scratch.pytorch.mlp" = "topics/02_xor_mlp/pytorch"
"ml_scratch.pytorch.linear_regression" = "topics/03_linear_regression/pytorch"
"ml_scratch.pytorch.logistic_regression" = "topics/04_logistic_regression/pytorch"
"ml_scratch.pytorch.pca_kmeans" = "topics/05_pca_kmeans/pytorch"
"ml_scratch.pytorch.decision_tree" = "topics/06_decision_tree/pytorch"
"ml_scratch.numpy.perceptron" = "topics/01_perceptron_logic_gates/numpy"
"ml_scratch.numpy.mlp" = "topics/02_xor_mlp/numpy"
"ml_scratch.numpy.linear_regression" = "topics/03_linear_regression/numpy"
"ml_scratch.numpy.logistic_regression" = "topics/04_logistic_regression/numpy"
"ml_scratch.numpy.pca_kmeans" = "topics/05_pca_kmeans/numpy"
"ml_scratch.numpy.decision_tree" = "topics/06_decision_tree/numpy"
"ml_scratch.pure.perceptron" = "topics/01_perceptron_logic_gates/python"
"ml_scratch.pure.mlp" = "topics/02_xor_mlp/python"
"ml_scratch.pure.linear_regression" = "topics/03_linear_regression/python"
"ml_scratch.pure.logistic_regression" = "topics/04_logistic_regression/python"
"ml_scratch.pure.pca_kmeans" = "topics/05_pca_kmeans/python"
"ml_scratch.pure.decision_tree" = "topics/06_decision_tree/python"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["topics", "tests"]
pythonpath = ["shared/python", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["shared/python", "topics", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
